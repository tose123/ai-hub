# 须在同步 newapi/main 时保留的本地行为契约。
# 仅记录相对上游仍存在的已审阅本地行为差异。提交历史只作证据；若
# 当前行为已与上游一致，不得写入。清单随仓库版本化，后续同步不得
# 依赖 Agent 的临时上下文。
schema_version: 1

upstream:
  remote: newapi
  branch: main

defaults:
  protected_feature_resolution: preserve_local_behavior
  upstream_security_overlap: ask_user
  unconfirmed_candidates: stop_before_merge

# 首次同步按产品领域归组，从本地独有功能提交生成候选项。修改 main 前，
# 必须按 SKILL.md 的精简方式请求分组确认。不得将清单或技能文件自身列为候选。
bootstrap:
  state: complete
  source_merge_base: 1db6ae19576d7019fec38cc63a3b94ce609c92c9
  reviewed_local_head: 14b39debcfee6a39bd706ae6bef9cd49588424a8

# 已审阅条目使用以下结构：
# - id: anytools-shared-auth
#   status: approved # pending_confirmation | approved | excluded
#   category: backend # backend | ui | ops
#   source_commits: [9b5afb557]
#   paths: [controller/anytools.go, middleware/auth.go]
#   symbols: [AnyToolsAuth]
#   behavior:
#     - AnyTools 请求必须携带本地配置的共享令牌。
#   verification:
#     - go test ./controller ./middleware
#   protection: preserve_local_behavior
#   upstream_security_overlap: ask_user
#   review_reason: "仅当 status 为 excluded 时必填。"
features:
  - id: anytools-shared-auth-and-billing
    status: approved
    category: backend
    source_commits: ["8eb7d05f2", "9b5afb557", "57d664b72"]
    paths:
      - .env.example
      - controller/anytools.go
      - controller/anytools_test.go
      - middleware/auth.go
      - model/quota_reserve.go
      - router/relay-router.go
    symbols: [AnytoolsAuth, GetAnytoolsBalance, CheckoutAnytools, TryReserveTokenQuota, TryReserveUserQuota]
    behavior:
      - 将旧 mcphub 接口改为 `/v1/anytools`，提供余额查询与按美元成本扣费接口。
      - 所有 AnyTools 请求须通过 `ANYTOOLS_AUTH_TOKEN` 与 `X-Anytools-Token` 的恒定时间校验。
      - 结算先原子预扣有限 API Key，再原子预扣用户钱包；任一余额不足均以 `HTTP 403`、`success: false` 拒绝，并区分 API Key 与钱包不足。
      - 钱包预扣失败时退还已扣 API Key；补偿失败则以 `HTTP 500` 失败、写入 `SysError` 高危告警，且不自动重试非幂等退款。
      - 仅在 API Key 与钱包均扣费成功后更新用户已用额度、请求次数及消费日志；失败或补偿异常不得写入消费统计。
    review_note: 用户于 2026-08-13 确认 AnyTools 改为余额充足型结算，不再允许钱包或有限 API Key 扣至负数，并采用上述扣费、补偿及错误响应契约。
    verification:
      - go test ./controller ./middleware ./model
    protection: preserve_local_behavior
    upstream_security_overlap: ask_user

  - id: token-auto-groups-and-cross-group-retry
    status: approved
    category: backend
    source_commits: ["834f86869", "8728ffa16", "4f165ff6d", "d2fa3b121", "e35ff78d5", "eb94dcd81", "7f9672195"]
    paths:
